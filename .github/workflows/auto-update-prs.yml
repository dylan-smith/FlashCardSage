name: Auto-update PRs

# main requires branches to be up to date, so a PR with auto-merge enabled stalls whenever something else merges
# first. After each push to main, this merges main into every such PR that's behind it and has no conflicts, so it
# reruns its checks and merges on its own. Dependabot PRs are handled by dependabot-rebase.yml instead.
#
# Requires the AUTOMERGE_TOKEN Actions secret: merges pushed with GITHUB_TOKEN wouldn't run CI on the PR, so the
# required checks would never report and the PR would never merge.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to main replaces a run that's still waiting, since it merges the newer main anyway
concurrency:
  group: auto-update-prs
  cancel-in-progress: false

jobs:
  update:
    name: Update PRs with main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Merge main into PRs
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/update-auto-merge-prs.sh
