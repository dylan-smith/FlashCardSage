<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FlashCardSage">
  <title>FlashCardSage</title>
  <!-- Two stacked flash cards: the back one tilted, the front one with two lines of text. -->
  <rect x="16" y="8" width="40" height="28" rx="4" fill="#1b9a57" transform="rotate(8 36 22)"/>
  <rect x="8" y="22" width="40" height="28" rx="4" fill="#0e2841"/>
  <rect x="14" y="31" width="18" height="3.5" rx="1.75" fill="#f3f4f6"/>
  <rect x="14" y="39" width="28" height="3.5" rx="1.75" fill="#f3f4f6" opacity="0.7"/>
</svg>
